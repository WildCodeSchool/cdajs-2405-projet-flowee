services:
  frontend:
    container_name: flowee-frontend
    # build: ./frontend
    image: cyriellethomas/flowee-deploy-client:prod-latest
    platform: linux/x86_64
    ports:
    - "8010:80"
    # command: sh -c "npm run build && npm run preview"
    restart: unless-stopped
    # volumes:
    #   - web-client-build:/app/dist
    env_file:
      - .env
    environment:
      NODE_ENV: production 
   
    # restart: always
  backend:
    container_name: flowee-backend
    # build: ./backend
    image: cyriellethomas/flowee-deploy-server:prod-latest
    platform: linux/x86_64
    # command: sh -c "npm run prod"  
    restart: unless-stopped
    ports:
    - "4000:4000"
    depends_on:
      - db
    env_file : 
      - .env
    environment:
      NODE_ENV: production
 

  db:
    container_name: flowee-db
    image: postgres:16
    restart: unless-stopped
    shm_size: 128mb
    volumes:
      - ./data:/var/lib/postgresql/data
    env_file : 
    - .env  
    ports:  
      - 5432:5432 #Port exposed to access Adminer also locally

  adminer:
    container_name: flowee-adminer
    image: adminer
    restart: always
    ports:
      - 8080:8080
  

  redis:
    container_name: flowee-redis
    hostname: redis
    image: redis

  redis-commander:
    container_name: flowee-redis-commander
    hostname: redis-commander
    image: rediscommander/redis-commander:latest
    platform: linux/x86_64
    restart: always
    depends_on:
      - redis
    environment:
    - REDIS_HOSTS=redis 
    ports:
    - "8881:8081"


