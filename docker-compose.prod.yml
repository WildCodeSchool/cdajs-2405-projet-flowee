
services:
  backend:
    container_name: flowee-backend
    image: cyriellethomas/flowee-deploy-server:latest # Mets un tag précis en prod !
    platform: linux/x86_64
    command: npm run startprod
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  db:
    container_name: flowee-db
    image: postgres:16
    restart: unless-stopped
    shm_size: 128mb
    env_file : 
      - .env
    expose:
      - 5432
    volumes:
      - db-data:/var/lib/postgresql/data

  adminer:
    container_name: flowee-adminer
    image: adminer
    restart: unless-stopped
    ports:
      - 8080:8080

  nginx:
    container_name: flowee-nginx
    image: nginx:alpine # Ou nginx:1.21.3 si tu veux rester sur la version précise
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8010}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx

  redis:
    container_name: flowee-redis
    hostname: redis
    image: redis:7-alpine 
    restart: unless-stopped

  redis-commander:
    container_name: flowee-redis-commander
    hostname: redis-commander
    image: rediscommander/redis-commander:latest
    platform: linux/x86_64
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_HOSTS=redis
    ports:
      - "8881:8081"

volumes:
  db-data:
