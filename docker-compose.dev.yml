services:
  frontend:
    container_name: flowee-frontend
    build: ./frontend
    command: sh -c "npm run dev"
    restart: unless-stopped
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app
      - /app/node_modules

  backend:
    container_name: flowee-backend
    build: ./backend
    command: sh -c "npm run start"
    restart: unless-stopped
    ports:
      - 4000:4000
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db
    env_file:
      - .env  
    environment:
      NODE_ENV: development

  db:
    container_name: flowee-db
    image: postgres:16
    restart: unless-stopped
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_USER: ${DB_SUPERUSER}
      POSTGRES_PASSWORD: ${DB_SUPERUSER_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - 5432:5432
    volumes:
      - ./data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "sh -c 'pg_isready -U ${DB_SUPERUSER} -d ${DB_NAME}'",
        ]
      interval: 10s
      timeout: 3s
      retries: 3

  adminer:
    container_name: flowee-adminer
    image: adminer
    restart: always
    ports:
      - 8080:8080
  redis:
    hostname: redis
    image: redis

  redis-commander:
    container_name: flowee-redis-commander
    hostname: redis-commander
    image: rediscommander/redis-commander:latest
    platform: linux/x86_64
    restart: always
    depends_on:
      - redis
    environment:
    - REDIS_HOSTS=redis 
    ports:
    - "8881:8081"
