name: Biome Check

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  biome:
    name: Run Biome Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run biome check (lint + format)
        run: npm run check
