name: vitest testing

on:
  pull_request:
    branches: [dev]

jobs:
  front-vitest-tests:
    name : Run Vitest Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest tests
        run: cd frontend && DEBUG=apollo:* npm run test