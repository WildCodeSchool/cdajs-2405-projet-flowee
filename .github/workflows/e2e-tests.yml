name: Playwright E2E Tests on Staging

on:
  workflow_dispatch: 
  workflow_run:
    workflows: ["Deploy Staging Frontend"] 
    types:
      - completed

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Wait for staging to be ready
        run: npx wait-on https://staging.052024-jaune-3.wns.wilders.dev/ --timeout 90000

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright
        working-directory: ./frontend
        run: npx playwright install --with-deps

      - name: Run Playwright E2E tests
        working-directory: ./frontend
        run: |
          E2E_BASE_URL=https://staging.052024-jaune-3.wns.wilders.dev npm run test:e2e

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
